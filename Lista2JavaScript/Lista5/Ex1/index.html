    <h2>Exercício 1</h2>

    <label for="texto"></label>

    <br><br>

        <input type="text" name="nome" id="nome"><br>

        <label for="dataNascimento">Data de Nascimento:</label>

        <label for="qntFilhos">Quantidade de filhos:</label>
        <input type="number" name="qntFilhos" id="qntFilhos"><br>
        <button type="submit(event)">Enviar</button>
    </form>
    
    <script src="ex1.js" defer></script>
